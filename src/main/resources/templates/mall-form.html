<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Add mall')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container mt-5 mh-auth" style="max-width: 660px;">
  <h1 class="h3 mb-3 mh-title">Add a mall</h1>
  <form th:action="@{/malls}" th:object="${mall}" method="post">
    <div class="mb-3">
      <label class="form-label">Name</label>
      <input class="form-control" th:field="*{name}" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Area (e.g. Whitefield)</label>
      <input class="form-control" th:field="*{area}">
    </div>
    <div class="mb-3">
      <label class="form-label">Address</label>
      <input class="form-control" th:field="*{address}">
    </div>
    <div class="row">
      <div class="col mb-3">
        <label class="form-label">Latitude</label>
        <input type="number" step="any" class="form-control" th:field="*{latitude}" required>
      </div>
      <div class="col mb-3">
        <label class="form-label">Longitude</label>
        <input type="number" step="any" class="form-control" th:field="*{longitude}" required>
      </div>
    </div>
    <button class="btn btn-primary" type="submit">Save</button>
    <a class="btn btn-link" th:href="@{/}">Cancel</a>
  </form>
</div>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
