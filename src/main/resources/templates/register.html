<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Register')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container mt-5 mh-auth" style="max-width: 440px;">
  <h1 class="h3 mb-3 mh-title">Create account</h1>

  <form th:action="@{/register}" th:object="${form}" method="post">
    <div class="mb-3">
      <label class="form-label">Name</label>
      <input class="form-control" th:field="*{name}">
      <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
    </div>
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input class="form-control" type="email" th:field="*{email}">
      <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input class="form-control" type="password" th:field="*{password}">
      <div class="text-danger small" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
    </div>
    <button class="btn btn-primary" type="submit">Register</button>
    <a class="btn btn-link" th:href="@{/login}">Already have an account?</a>
  </form>
</div>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
