<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' | MallHub'">MallHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/mallhub.css}">
</head>
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark mh-navbar">
  <div class="container">
    <a class="navbar-brand" th:href="@{/}">&#128717; MallHub Bengaluru</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <div class="navbar-nav me-auto">
        <a class="nav-link" th:href="@{/}">Malls</a>
        <a class="nav-link" th:href="@{/stores}">Stores</a>
        <a class="nav-link" th:href="@{/offers}">Offers</a>
        <a class="nav-link" th:href="@{/parking}">Parking</a>
        <a class="nav-link" th:href="@{/loyalty}" sec:authorize="isAuthenticated()">Rewards</a>
        <a class="nav-link" th:href="@{/admin}" sec:authorize="hasAnyRole('MALL_ADMIN','SUPER_ADMIN')">Admin</a>
      </div>
      <div class="navbar-nav align-items-lg-center">
        <a class="nav-link" th:href="@{/notifications}" sec:authorize="isAuthenticated()">
          Alerts
          <span class="badge bg-danger" th:if="${unreadCount != null and unreadCount > 0}" th:text="${unreadCount}">0</span>
        </a>
        <a class="nav-link" th:href="@{/login}" sec:authorize="!isAuthenticated()">Login</a>
        <a class="nav-link" th:href="@{/register}" sec:authorize="!isAuthenticated()">Register</a>
        <span class="navbar-text mx-2" sec:authorize="isAuthenticated()">
          Hi, <span sec:authentication="name"></span>
        </span>
        <form class="d-inline" th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()">
          <button class="btn btn-outline-light btn-sm" type="submit">Logout</button>
        </form>
      </div>
    </div>
  </div>
</nav>

<div th:fragment="alerts">
  <div class="alert alert-success" th:if="${msg}" th:text="${msg}"></div>
  <div class="alert alert-danger" th:if="${err}" th:text="${err}"></div>
</div>

<ul th:fragment="adminTabs(active)" class="nav nav-tabs mb-3">
  <li class="nav-item"><a class="nav-link" th:classappend="${active == 'dashboard'} ? 'active'" th:href="@{/admin}">Dashboard</a></li>
  <li class="nav-item"><a class="nav-link" th:classappend="${active == 'catalog'} ? 'active'" th:href="@{/admin/catalog}">Stores &amp; import</a></li>
  <li class="nav-item"><a class="nav-link" th:classappend="${active == 'offers'} ? 'active'" th:href="@{/admin/offers}">Offers</a></li>
  <li class="nav-item"><a class="nav-link" th:classappend="${active == 'bills'} ? 'active'" th:href="@{/admin/bills}">Bills</a></li>
</ul>

<footer th:fragment="footer" class="mh-footer">
  <small>&#128717; MallHub &middot; every Bengaluru mall in one place</small>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</footer>
</body>
</html>
